<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kassa</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kassa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script>try{if(localStorage.getItem("kassa.hide")==="1")document.documentElement.classList.add("priv")}catch(e){}</script>
<script>try{var t=localStorage.getItem("kassa.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Layout: one phone-width column, bank-app style — big balance on top, dark cards, fixed 5-tab bar at the bottom, bottom sheets for input */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#ececf1; --line:#e3e3e8;
  --fg:#000000; --muted:#6c6c70; --accent:#5856d6; --accent-ink:#ffffff; --status:#5856d6;
  --income:#248a3d; --expense:#d70015; --debt:#c93400; --save:#0071a4;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:#38383a;
  --fg:#ffffff; --muted:#98989f; --accent:#5e5ce6; --accent-ink:#ffffff; --status:#000000;
  --income:#30d158; --expense:#ff453a; --debt:#ff9f0a; --save:#64d2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:#38383a;
  --fg:#ffffff; --muted:#98989f; --accent:#5e5ce6; --accent-ink:#ffffff; --status:#000000;
  --income:#30d158; --expense:#ff453a; --debt:#ff9f0a; --save:#64d2ff; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--status)}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;padding-block:12px 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:6px 14px}
.brand{font-weight:700;font-size:28px;letter-spacing:-.02em}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.avatar svg{width:22px;height:22px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--fg);margin:26px 0 10px}
#sheet h2{font-size:15px;color:var(--muted);font-weight:600;margin:20px 0 6px}
.sample{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:14px}
.sample button{color:var(--accent);font-weight:700;font-size:13px}
.hero{padding-block:8px 18px}
.hero .lbl{color:var(--muted);font-size:14px;font-weight:600}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.hero .sub{margin-top:8px;display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--save)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:6px 6px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--fg)}
.quick .ic{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.quick svg{width:24px;height:24px}
.card{background:var(--surface);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split>div{min-width:0}
.k{font-size:13px;color:var(--muted);font-weight:600}
.v{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.in{color:var(--income)} .out{color:var(--expense)} .dbt{color:var(--debt)} .sav{color:var(--save)}
.cmp{margin-top:14px;display:grid;gap:8px}
.cmp-row{display:grid;grid-template-columns:72px 1fr 84px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cmp-row .val{text-align:right;color:var(--fg);font-weight:600}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:99px}
.alert{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.35}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.tile{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--surface-2)}
.tile svg{width:20px;height:20px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:600;white-space:nowrap}
.linkbtn{color:var(--accent);font-weight:700;font-size:14px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.headrow h2{margin:0}
.sec{margin-top:26px}
.sec>.headrow{margin-bottom:10px}
.month{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:4px}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.month button:disabled{opacity:.3;cursor:default}
.month span{font-weight:700;font-size:14px;min-width:96px;text-align:center}
.donutwrap{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.donutbox{position:relative;width:140px;height:140px}
.donutbox svg{width:140px;height:140px;display:block}
.donutbox .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--muted)}
.donutbox .c b{display:block;color:var(--fg);font-size:13px;margin-top:2px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:grid;gap:8px;min-width:0;font-size:13px}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted)}
.lim{display:grid;gap:6px;padding:10px 0}
.lim+.lim{border-top:1px solid var(--line)}
.lim .top2{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.lim .top2 b{font-weight:700}
.lim .top2 span{color:var(--muted)}
.daylbl{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;margin-top:14px}
.seg button{padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.seg3{grid-template-columns:repeat(3,1fr);background:var(--bg)}
.seg3 button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pick{cursor:pointer}
.pick input{flex:none;width:22px;height:22px;accent-color:var(--accent)}
.person{display:block;width:100%;text-align:left}
.person .p1{display:flex;align-items:center;gap:12px}
.ini{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px}
.person .p2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.jar{display:block;width:100%;text-align:left}
.jar .j1{display:flex;align-items:center;gap:12px}
.jar .advice{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.4}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px;line-height:1.5}
details.closed summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;padding:6px 0;list-style:none}
details.closed summary::-webkit-details-marker{display:none}
/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav .in2{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
nav svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--fg)}
nav button[aria-current="page"] svg{color:var(--accent)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:19;right:max(20px, calc((100vw - 480px)/2 + 20px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));
  height:54px;padding:0 20px 0 16px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab svg{width:22px;height:22px;stroke-width:2.6}
/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#scrim.open{opacity:1}
#sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:90%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:8px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));transform:translateY(100%);transition:transform .25s ease}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 14px}
#sheet h3{margin:0 0 14px;font-size:20px;font-weight:700}
form{display:flex;flex-direction:column;gap:14px}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-color:var(--accent)}
.amount input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:38px;font-weight:700;letter-spacing:-.02em}
.amount span{font-size:28px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 12px;border-radius:99px;background:var(--surface-2);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid transparent}
.chip input:checked+span{border-color:var(--accent);color:var(--accent)}
.chip-add{padding:8px 12px;border-radius:99px;border:1.5px dashed var(--line);color:var(--accent);font-weight:700;font-size:14px}
.newcat{display:flex;flex-direction:column;gap:12px;background:var(--bg);border-radius:16px;padding:14px}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.field input{background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px;font-size:16px;color:var(--fg);outline:0;min-width:0;width:100%}
.field input:focus{border-color:var(--accent)}
.field select{background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btn{height:52px;border-radius:14px;font-weight:700;font-size:16px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:none;color:var(--expense);height:44px;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.stat span{color:var(--muted)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(150px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast.act button{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:10px}
.notice b{display:block;font-weight:600;font-size:15px}
.notice span{color:var(--muted)}
.notice .acts{display:flex;gap:12px;flex:none}
.notice .acts button{color:var(--accent);font-weight:600;font-size:14px}
.notice .acts button.mute{color:var(--muted);font-weight:500}
.hero .big{cursor:pointer;display:block;text-align:left}
.priv .pv{filter:blur(10px)}
.hero .lbl{display:flex;align-items:center;gap:8px}
.eye{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--muted)}
.eye svg{width:20px;height:20px}
.cmp-row small{display:block;font-size:11px;opacity:.8}
.smart{display:flex;gap:8px;margin-top:18px}
.smart input{flex:1;min-width:0;background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font-size:16px;color:var(--fg);outline:0}
.smart input:focus{border-color:var(--accent)}
.smart button{flex:none;padding:0 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.smart-prev{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px;padding-left:4px}
.smart-prev b{color:var(--fg);font-weight:600}
.presets{display:flex;gap:8px;overflow-x:auto;margin:14px calc(-1*max(16px, env(safe-area-inset-left, 0px))) 0;padding:0 max(16px, env(safe-area-inset-left, 0px)) 2px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:9px 14px;font-size:15px;font-weight:500;white-space:nowrap}
.presets button.add{color:var(--accent);font-weight:600}
.kpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpad button{height:48px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:500}
.kpad button.op{color:var(--accent);font-weight:600}
.calc{min-height:18px;font-weight:500;color:var(--muted);margin-top:-6px}
#app .row{transition:transform .18s ease}
#app .row.swiping{transition:none}
@media (prefers-reduced-motion:reduce){#sheet,#scrim,.toast{transition:none}}
@media (max-width:360px){.donutwrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}.hero .big{font-size:36px}}
</style>
</head>
<body>

<div id="app"></div>
<button class="fab" id="fab" hidden></button>
<nav aria-label="Bölmələr"><div class="in2" id="nav"></div></nav>
<div id="scrim" hidden data-act="close"></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>

/* monthly repeats: a template with recur:true gets one copy per following month */
function applyRecurring(){
  S.tx.filter(t=>t.recur).forEach(t=>{
    const day=parse(t.date).getDate();
    for(let m=-36;m<=0;m++){
      const date=md(m,day);
      if(date<=t.date.slice(0,7)+'-31'||date>TODAY)continue;
      const key=date.slice(0,7);
      if(!S.tx.some(x=>x.recurOf===t.id&&x.date.slice(0,7)===key))
        S.tx.push({...t,amt:t.recurAmt??t.amt,recurAmt:undefined,id:uid(),date,recur:false,recurOf:t.id});
    }
  });
}

const norm=s=>String(s||'').toLocaleLowerCase('az').replace(/[^\p{L}\p{N}\s]/gu,' ').trim();
const KW={neqliyyat:['taksi','taxi','bolt','uber','metro','avtobus','benzin','yanacaq','parkovka'],market:['market','bravo','araz','bazarstore','oba','bazar','çörək','ərzaq'],

  geyim:['paltar','ayaqqabı','köynək','şalvar','geyim','gödəkçə'],maas:['maaş','əməkhaqqı'],frilans:['frilans','sifariş'],hediyye:['hədiyyə'],satis:['satış','satdım']};
function guessCat(text,kind){
  const words=norm(text).split(/\s+/).filter(w=>w.length>1&&!/^\d/.test(w));if(!words.length)return null;
  const ok=id=>!kind||allCats(kind).some(c=>c.id===id);
  const full=words.join(' ');if(S.memo[full]&&ok(S.memo[full]))return S.memo[full];
  for(const w of words)if(S.memo[w]&&ok(S.memo[w]))return S.memo[w];
  const list=kind?allCats(kind):[...allCats('out'),...allCats('in')];
  for(const w of words){const c=list.find(c=>{const n=norm(c.n);return n===w||(w.length>=4&&(n.startsWith(w)||w.startsWith(n)))});if(c)return c.id}
  for(const w of words)for(const [id,ks] of Object.entries(KW))if(ks.some(k=>w===k||(k.length>=4&&w.startsWith(k)))&&ok(id))return id;
  return null}
function remember(note,c){const words=norm(note).split(/\s+/).filter(w=>w.length>2&&!/^\d/.test(w));if(!words.length)return;
  S.memo[words.join(' ')]=c;words.forEach(w=>S.memo[w]=c);const ks=Object.keys(S.memo);if(ks.length>600)ks.slice(0,ks.length-600).forEach(k=>delete S.memo[k])}
const NUMW={sıfır:0,bir:1,iki:2,üç:3,dörd:4,beş:5,altı:6,yeddi:7,səkkiz:8,doqquz:9,on:10,iyirmi:20,otuz:30,qırx:40,əlli:50,altmış:60,yetmiş:70,səksən:80,doxsan:90};
function parseSmart(text){
  const toks=String(text||'').trim().split(/\s+/).filter(Boolean);let man=null,qep=null,total=0,cur=0,seen=false;const rest=[];
  for(const raw of toks){const w=norm(raw);
    const m=raw.replace(/₼|azn|manat/gi,'').replace(',','.').match(/^\d+(\.\d+)?$/);
    if(m){cur+=parseFloat(m[0]);seen=true;continue}
    if(w in NUMW){cur+=NUMW[w];seen=true;continue}
    if(w==='yüz'){cur=(cur||1)*100;seen=true;continue}
    if(w==='min'){total+=(cur||1)*1000;cur=0;seen=true;continue}
    if(w==='yarım'){cur+=0.5;seen=true;continue}
    if(w==='manat'||w==='azn'){man=(man||0)+total+cur;total=0;cur=0;continue}
    if(w==='qəpik'){qep=(qep||0)+total+cur;total=0;cur=0;continue}
    rest.push(raw)}
  const amt=Math.round(((man||0)+(qep||0)/100+total+cur)*100)/100;
  let c=guessCat(rest.join(' '));let kind=c&&!allCats('out').some(x=>x.id===c)?'in':'out';
  // "hədiyyə" alone is ambiguous: income only when it says it was received
  if(kind==='in'&&c==='hediyye'&&!/(aldım|gəldi|verdilər|bağışladı)/.test(norm(text))){c=null;kind='out'}
  let note=rest.join(' ').trim();if(c&&norm(note)===norm(cat(kind,c).n))note='';
  return {amt:seen?amt:0,cat:c,kind,note}}

function donut(parts,total){
  const r=54,C=2*Math.PI*r;let o=0;
  const segs=parts.map(p=>{const len=p.v/total*C;const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${Math.max(len-(parts.length>1?2:0),.1)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`;o+=len;return s}).join('');
  return `<svg viewBox="0 0 140 140" aria-hidden="true"><circle r="${r}" cx="70" cy="70" fill="none" stroke="var(--surface-2)" stroke-width="18"/>${segs}</svg>`;
}

  ${parts.length?`<div class="card donutwrap"><div class="donutbox">${donut(parts,total)}<div class="c">Ən çox · ${Math.round(parts[0].v/total*100)}%<b>${esc(parts[0].n)}</b></div></div>

  ${lim}

function jarAdvice(j){
  const s=jarSum(j);if(!j.goal)return '';

  if(!j.due)return `Hədəfə ${fmt(j.goal-s)} qalıb.`;
  const a=parse(TODAY),b=parse(j.due);const months=Math.max((b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth(),1);
  return `Hədəfə çatmaq üçün ayda <b class="num">${fmt((j.goal-s)/months)}</b> yığmalısan (${months} ay qalıb).`;
}

async function exportData(){
  const name=`kassa-${TODAY}.json`;
  const file=new File([JSON.stringify({app:'kassa',exported:new Date().toISOString(),data:S},null,1)],name,{type:'application/json'});
  const done=()=>{try{localStorage.setItem('kassa.lastBackup',TODAY)}catch(e){}toast('Nüsxə hazırdır');settings()};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Kassa nüsxəsi'});done();return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);done();
}

/* finds the example records the app added on first launch, so they can be removed without touching the user's own */
function sampleFind(){
  const ref=sample(),key=t=>`${t.kind}|${t.amt}|${t.cat}|${t.note}`;
  const recur=new Set(ref.tx.filter(t=>t.recur).map(key)),left={};
  ref.tx.filter(t=>!t.recur).forEach(t=>left[key(t)]=(left[key(t)]||0)+1);
  const tx=S.tx.filter(t=>{const k=key(t);if(recur.has(k))return true;if(left[k]>0){left[k]--;return true}return false});
  const debts=S.debts.filter(d=>ref.debts.some(r=>r.name===d.name&&r.dir===d.dir&&d.ops[0]&&d.ops[0].type==='loan'&&d.ops[0].amt===r.ops[0].amt));
  const jars=S.jars.filter(j=>ref.jars.some(r=>r.name===j.name&&r.ic===j.ic&&r.goal===j.goal));
  const lim=Object.keys(ref.limits).filter(k=>S.limits[k]===ref.limits[k]);
  return {tx,debts,jars,lim,count:tx.length+debts.length+jars.length+lim.length};
}

/* events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const [a,b,c]=el.dataset.act.split(':');
  const go=t=>{tab=t;close();render();window.scrollTo(0,0)};
  switch(a){
    case 'tab':go(b);break;
    case 'close':close();break;
    case 'add':b==='in'||b==='out'?txForm(b):b==='debt'?debtForm():b==='jar'?jarForm():jarQuick();break;
    case 'tx':txDetail(b);break;
    case 'debt':debtDetail(b);break;

    case 'limit':limitForm(b);break;
    case 'all':allFeed();break;
    case 'preset':{const pr=S.presets.find(x=>x.id===b);if(!pr)break;snap();addTx(pr.kind,pr.amt,pr.cat,pr.note);save();render();toast((pr.note||cat(pr.kind,pr.cat).n)+' · '+fmt(pr.amt)+' yazıldı',true);break}
    case 'newpreset':presetForm();break;
    case 'editpreset':presetForm(S.presets.find(x=>x.id===b));break;
    case 'delpreset':S.presets=S.presets.filter(x=>x.id!==b);if(S.quick)S.quick=S.quick.filter(k=>k!=='p:'+b);save();render();presetList();toast('Düymə silindi');break;
    case 'presets':presetList();break;
    case 'quick':quickForm();break;
    case 'again':{const t=S.tx.find(x=>x.id===b);if(!t)break;snap();addTx(t.kind,t.amt,t.cat,t.note);save();close();render();toast('Bu gün üçün yazıldı',true);break}
    case 'mkpreset':{const t=S.tx.find(x=>x.id===b);if(!t)break;if(t.kind!=='out'){toast('Sürətli düymə xərclər üçündür');break}
      S.presets.push({id:uid(),kind:'out',amt:t.amt,cat:t.cat,note:t.note||''});save();close();render();toast('Sürətli düymə yaradıldı');break}
    case 'hide':{const on=!hidden();document.documentElement.classList.toggle('priv',on);try{localStorage.setItem('kassa.hide',on?'1':'0')}catch(e){}render();break}
    case 'editjar':{const j=S.jars.find(x=>x.id===b);if(j)jarForm(j);break}
    case 'recurs':recurList();break;
    case 'recamt':recAmtForm(b);break;
    case 'balance':balanceForm();break;
    case 'balok':S.balanceSet=true;save();render();break;
    case 'edittx':{const t=S.tx.find(x=>x.id===b);if(t)txForm(t.kind,t);break}
    case 'undo':if(undoState){S=JSON.parse(undoState);undoState=null;save();close();render();toast('Geri qaytarıldı')}break;
    case 'settings':settings();break;
    case 'theme':setTheme(b);settings();break;
    case 'export':exportData();break;
    case 'samples':sampleSheet();break;
    case 'doimport':if(pendingImport){try{localStorage.setItem('kassa.v1.before-import',JSON.stringify(S))}catch(e){}
      S=pendingImport;pendingImport=null;if(!S.cats)S.cats={in:[],out:[]};if(!S.limits)S.limits={};if(!S.presets)S.presets=[];if(!S.memo)S.memo={};applyRecurring();save();close();tab='home';render();toast('Məlumatlar yükləndi')}break;
    case 'm':mOff[b]=Math.min(0,mOff[b]+Number(c));render();break;
    case 'dir':debtDir=b;render();break;
    case 'clear':confirmDel('Nümunə məlumatlar silinsin?','doclear');break;
    case 'doclear':S={v:1,sample:false,tx:[],limits:{},debts:[],jars:[],cats:S.cats||{in:[],out:[]}};save();close();render();toast('Təmiz başlanğıc');break;
    case 'newcat':{const p=document.getElementById('newCat');p.hidden=false;el.hidden=true;setTimeout(()=>document.getElementById('f-catname').focus(),50);break}
    case 'newcat-cancel':{document.getElementById('newCat').hidden=true;const ab=document.querySelector('.chip-add');if(ab)ab.hidden=false;break}
    case 'newcat-save':{
      const inp=document.getElementById('f-catname');const name=inp.value.trim();
      if(!name){toast('Kateqoriyanın adını yaz');inp.focus();break}
      let c=allCats(b).find(x=>x.n.toLowerCase()===name.toLowerCase());
      if(!c){c={id:'c_'+uid(),ic:(document.querySelector('input[name=catic]:checked')||{}).value||'🏷️',n:name,c:CUSTOM_COL[S.cats[b].length%CUSTOM_COL.length]};S.cats[b].push(c);save();toast('Kateqoriya yaradıldı')}
      document.getElementById('catChips').innerHTML=catChips(b,c.id);
      document.getElementById('newCat').hidden=true;inp.value='';break}
    case 'mycats':manageCats(b);break;
    case 'delcat':confirmDel('Kateqoriya silinsin?','dodelcat:'+b+':'+c);break;
    case 'dodelcat':snap();S.cats[b]=S.cats[b].filter(x=>x.id!==c);S.tx.forEach(t=>{if(t.kind===b&&t.cat===c)t.cat='diger'});delete S.limits[c];save();render();manageCats(b);toast('Silindi',true);break;
    case 'deltx':confirmDel('Qeyd silinsin?','dodeltx:'+b);break;
    case 'dodeltx':{snap();const t=S.tx.find(x=>x.id===b);if(t&&t.debtId){const d=S.debts.find(x=>x.id===t.debtId);if(d)d.ops=d.ops.filter(o=>o.txId!==b)}}S.tx=S.tx.filter(t=>t.id!==b);save();close();render();toast('Silindi',true);break;
    case 'stoprecur':{const t=S.tx.find(x=>x.id===b);if(t)t.recur=false;save();close();render();toast('Təkrar dayandırıldı');break}
    case 'deldebt':confirmDel('Borc silinsin?','dodeldebt:'+b);break;
    case 'dodeldebt':snap();S.tx.forEach(t=>{if(t.debtId===b)delete t.debtId});S.debts=S.debts.filter(d=>d.id!==b);save();close();render();toast('Silindi',true);break;
    case 'deljar':confirmDel('Qutu silinsin?','dodeljar:'+b);break;
    case 'dodeljar':snap();S.jars=S.jars.filter(j=>j.id!==b);save();close();render();toast('Silindi',true);break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)close()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const inp=document.getElementById('f-amt');if(!inp)return;
  const k=b.dataset.k;let v=inp.value;
  if(k==='⌫')v=v.slice(0,-1);else if(k==='='){const n=num(v);v=n?String(n).replace('.',','):''}
  else if(k==='+'||k==='−'){v=v.replace(/[+−]$/,'');if(v)v+=k}
  else if(k===','){const last=v.split(/[+−]/).pop();if(!last.includes(','))v+=(last?'':'0')+','}
  else{const last=v.split(/[+−]/).pop();if(!(last.includes(',')&&last.split(',')[1].length>=2))v+=k}
  inp.value=v;const c=document.getElementById('calc');c.textContent=/[+−]/.test(v)?'= '+fmt(num(v)):''});
document.addEventListener('input',e=>{if(e.target.id==='f-smart')smartPreview()});
/* swipe a record: left deletes (with undo), right opens it for editing */
let sw=null,swUsed=false;
document.addEventListener('touchstart',e=>{const r=e.target.closest('#app .row[data-act^="tx:"]');if(!r){sw=null;return}const t=e.touches[0];sw={r,x:t.clientX,y:t.clientY,dx:0,on:false}},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)>12)sw.on=true;else return}
  sw.dx=dx;sw.r.classList.add('swiping');sw.r.style.transform=`translateX(${dx}px)`;
  sw.r.style.background=dx<0?'color-mix(in srgb, var(--expense) 14%, transparent)':'color-mix(in srgb, var(--accent) 14%, transparent)'},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const {r,dx,on}=sw;sw=null;if(!on)return;swUsed=true;setTimeout(()=>swUsed=false,350);
  r.classList.remove('swiping');r.style.transform='';r.style.background='';const id=r.dataset.act.slice(3);
  if(dx<-90){const t=S.tx.find(x=>x.id===id);if(!t)return;snap();if(t.debtId){const d=S.debts.find(x=>x.id===t.debtId);if(d)d.ops=d.ops.filter(o=>o.txId!==id)}
    S.tx=S.tx.filter(x=>x.id!==id);save();render();toast('Silindi',true)}
  else if(dx>90){const t=S.tx.find(x=>x.id===id);if(t&&!t.adj)txForm(t.kind,t)}});
document.addEventListener('click',e=>{if(swUsed){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('change',e=>{if(e.target.id==='f-import'&&e.target.files[0])readImport(e.target.files[0])});
/* the phone can keep the app open for days: start fresh when the date has changed */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&iso(new Date())!==TODAY)location.reload()});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f),type=f.dataset.form;
  if(type==='samples'){snap();const picks=fd.getAll('pick').map(v=>v.split(':'));const ids=k=>new Set(picks.filter(p=>p[0]===k).map(p=>p[1]));
    const tx=ids('tx'),db=ids('debt'),jr=ids('jar'),lm=ids('lim');
    S.tx.filter(t=>tx.has(t.id)&&t.debtId).forEach(t=>{const d=S.debts.find(x=>x.id===t.debtId);if(d)d.ops=d.ops.filter(o=>o.txId!==t.id)});
    S.tx=S.tx.filter(t=>!tx.has(t.id));S.tx.forEach(t=>{if(db.has(t.debtId))delete t.debtId});
    S.debts=S.debts.filter(d=>!db.has(d.id));S.jars=S.jars.filter(j=>!jr.has(j.id));lm.forEach(k=>delete S.limits[k]);
    S.sample=false;save();close();render();toast(picks.length+' nümunə silindi',true);return}
  const op=(e.submitter&&e.submitter.value)||'';
  const amt=num(fd.get('amt'));
  if(type==='smart'){const r=parseSmart(fd.get('q'));
    if(!r.amt){toast('Məbləği də yaz, məs. “taksi 5”');return}
    if(!r.cat){txForm(r.kind,null,{amt:r.amt,note:r.note});return}
    snap();addTx(r.kind,r.amt,r.cat,r.note);save();render();toast(cat(r.kind,r.cat).n+' · '+fmt(r.amt)+' yazıldı',true);return}
  if(type==='quick'){const ks=fd.getAll('qk');if(!ks.length){toast('Ən az 1 düymə seç');return}S.quick=ks.slice(0,4);save();close();render();toast('Düymələr yeniləndi');return}
  if(type==='preset'){const a=num(fd.get('amt'));if(!(a>0)){toast('Məbləği yaz');return}
    const v={kind:'out',amt:a,cat:fd.get('cat'),note:(fd.get('note')||'').trim()};
    if(f.dataset.id)Object.assign(S.presets.find(x=>x.id===f.dataset.id),v);else S.presets.push({id:uid(),...v});
    save();close();render();toast('Sürətli düymə yadda saxlandı');return}
  if(type==='balance'){const raw=(fd.get('amt')||'').trim();if(!raw){toast('Məbləği yaz');return}
    const diff=Math.round((amt-totals().bal)*100)/100;S.balanceSet=true;
    if(Math.abs(diff)>=0.01)S.tx.push({id:uid(),kind:diff>0?'in':'out',amt:Math.abs(diff),cat:'adj',adj:true,date:TODAY,note:'Balans düzəlişi',recur:false});
    save();close();render();toast(Math.abs(diff)>=0.01?'Balans düzəldildi':'Balans artıq düzgündür');return}
  if(type!=='jar'&&type!=='limit'&&!(amt>0)){toast('Məbləği yaz');return}
  if(type==='recamt'){const t=S.tx.find(x=>x.id===f.dataset.id);if(t)t.recurAmt=amt;save();close();render();toast('Aylıq məbləğ dəyişdi');return}
  if(type==='tx'&&f.dataset.id){const t=S.tx.find(x=>x.id===f.dataset.id),kind=t.kind,c=fd.get('cat');
    const oldD=t.debtId?S.debts.find(x=>x.id===t.debtId):null,oldOp=oldD?oldD.ops.find(o=>o.txId===t.id):null;
    const d=c===DEBT_CAT[kind]&&fd.get('debt')?S.debts.find(x=>x.id===fd.get('debt')):null;
    if(d&&amt>debtLeft(d)+(oldOp&&oldD===d?oldOp.amt:0)+0.004){toast('Qalıqdan çox ola bilməz');return}
    if(oldD&&oldOp)oldD.ops=oldD.ops.filter(o=>o!==oldOp);delete t.debtId;
    Object.assign(t,{amt,cat:c,date:fd.get('date')||t.date,note:(fd.get('note')||'').trim(),recur:t.recurOf?false:!!fd.get('recur')&&!d});if(t.note)remember(t.note,c);
    if(d){t.debtId=d.id;d.ops.push({type:'pay',amt,date:t.date,txId:t.id})}
    save();close();render();toast('Dəyişdirildi');return}
  if(type==='tx'){const kind=f.dataset.kind,c=fd.get('cat');
    const d=c===DEBT_CAT[kind]&&fd.get('debt')?S.debts.find(x=>x.id===fd.get('debt')):null;
    if(d&&amt>debtLeft(d)+0.004){toast('Qalıqdan çox ola bilməz: '+fmt(debtLeft(d)));return}
    const t={id:uid(),kind,amt,cat:c,date:fd.get('date')||TODAY,note:(fd.get('note')||'').trim()||(d?(kind==='in'?d.name+' borcu qaytardı':d.name+' adlı şəxsə borc ödənişi'):''),recur:!!fd.get('recur')&&!d};
    if(d){t.debtId=d.id;d.ops.push({type:'pay',amt,date:t.date,txId:t.id})}
    S.tx.push(t);if(t.note&&!d)remember(t.note,c);
    const k=f.dataset.kind;mOff[k]=0;toast(k==='in'?'Gəlir əlavə olundu':'Xərc əlavə olundu')}
  else if(type==='debt'){const dir=fd.get('dir'),name=(fd.get('name')||'').trim(),date=fd.get('date')||TODAY;
    let d=S.debts.find(x=>x.dir===dir&&x.name.toLowerCase()===name.toLowerCase()&&isOpen(x));
    const nt=(fd.get('note')||'').trim();
    if(d){d.ops.push({type:'loan',amt,date,note:nt});if(!d.note&&nt)d.note=nt;if(fd.get('due'))d.due=fd.get('due')}
    else S.debts.push({id:uid(),dir,name,due:fd.get('due')||'',note:(fd.get('note')||'').trim(),ops:[{type:'loan',amt,date}]});
    debtDir=dir;toast(d?'Borc karta əlavə olundu':'Borc yazıldı')}
  else if(type==='debtop'){const d=S.debts.find(x=>x.id===f.dataset.id);const o=op||'pay';
    if(o==='pay'&&amt>debtLeft(d)+0.004){toast('Qalıqdan çox ola bilməz');return}
    const dt=fd.get('opdate')||TODAY;const rec={type:o,amt,date:dt};
    if(o==='pay'&&fd.get('astx')){const kind=d.dir;const t={id:uid(),kind,amt,cat:DEBT_CAT[kind],date:dt,note:kind==='in'?d.name+' borcu qaytardı':d.name+' adlı şəxsə borc ödənişi',recur:false,debtId:d.id};S.tx.push(t);rec.txId=t.id}
    d.ops.push(rec);toast(o==='pay'?(isOpen(d)?'Ödəniş yazıldı':'Borc bağlandı ✓'):'Borc artırıldı')}
  else if(type==='jar'&&f.dataset.id){const j=S.jars.find(x=>x.id===f.dataset.id);Object.assign(j,{name:(fd.get('name')||'').trim()||j.name,ic:fd.get('ic')||j.ic,goal:num(fd.get('goal')),due:fd.get('due')||''});toast('Qutu yeniləndi')}
  else if(type==='jar'){S.jars.push({id:uid(),name:(fd.get('name')||'').trim(),ic:fd.get('ic'),goal:num(fd.get('goal')),due:fd.get('due')||'',ops:[]});toast('Qutu yaradıldı')}
  else if(type==='jarop'||type==='jarquick'){const j=S.jars.find(x=>x.id===(f.dataset.id||fd.get('jar')));const take=op==='take';
    if(take&&amt>jarSum(j)+0.004){toast('Qutuda bu qədər pul yoxdur');return}
    const before=jarSum(j);j.ops.push({amt:take?-amt:amt,date:TODAY});
    toast(!take&&j.goal&&before<j.goal&&jarSum(j)>=j.goal?'🎉 Hədəfə çatdın!':take?'Götürüldü':'Ehtiyata qoyuldu')}
  else if(type==='limit'){const k=fd.get('cat');if(amt>0)S.limits[k]=amt;else delete S.limits[k];toast(amt>0?'Limit qoyuldu':'Limit silindi')}
  save();close();render();
});
try{localStorage.removeItem('kassa.pin')}catch(e){}
render();syncThemeColor();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
